const courses={"real-analysis":"Real Analysis","complex-analysis":"Complex Analysis","abstract-algebra":"Abstract Algebra","commutative-algebra":"Commutative Algebra","algebraic-geometry":"Algebraic Geometry","number-theory":"Number Theory","calculus":"Calculus"};const p=new URLSearchParams(location.search),course=p.get("course")||"calculus",type=p.get("type")||"pdf",name=courses[course]||"Mathematics",label=type==="html"?"HTML":type==="exercises"?"Exercises":"PDF";document.title=name+" · "+label+" · Jiayu Chen";document.getElementById("title").textContent=name;document.getElementById("subtitle").textContent=label+" · Weekly materials";for(let i=1;i<=12;i++){let e=document.createElement("a"),ext=type==="html"?"html":"pdf";e.className="week";e.href="/en/notes/mathematical%20notes/"+course+"/week-"+String(i).padStart(2,"0")+"-"+type+"."+ext;e.textContent="Week "+i;if(ext==="pdf"){e.target="_blank";e.rel="noopener"}document.getElementById("weeks").appendChild(e)}const r=document.documentElement,t=document.getElementById("theme-toggle"),s=localStorage.getItem("theme"),d=matchMedia("(prefers-color-scheme: dark)").matches;function theme(x){r.classList.toggle("dark",x);t.textContent=x?"Light":"Dark"}theme(s?s==="dark":d);t.onclick=()=>{let x=!r.classList.contains("dark");theme(x);localStorage.setItem("theme",x?"dark":"light")};
