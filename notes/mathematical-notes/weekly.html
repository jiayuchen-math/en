<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weekly Notes · Jiayu Chen</title>
<style>
:root{--bg:#fff;--text:#242424;--muted:#6b7280;--link:#1458a6;--line:#e5e7eb;--soft:#f8fafc}:root.dark{--bg:#15171a;--text:#e8eaed;--muted:#a6adb8;--link:#8ab4f8;--line:#30343b;--soft:#20242a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.8 Georgia,"Times New Roman",serif}main{width:min(760px,calc(100% - 40px));margin:0 auto;padding:58px 0 80px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:38px}h1{margin:0 0 5px;font-size:clamp(28px,5vw,38px);font-weight:600;letter-spacing:-.02em}h2{margin:0 0 9px;font-size:22px;font-weight:600}p{margin:5px 0 12px}a{color:var(--link);text-decoration:underline;text-underline-offset:2px}.muted{color:var(--muted)}
.back{margin-bottom:25px}.weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:22px}.week{display:block;padding:10px 13px;border:1px solid var(--line);border-radius:6px;background:var(--soft);text-decoration:none}.week:hover{border-color:var(--muted)}
button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit;line-height:1.3}footer{margin-top:55px;color:var(--muted);font-size:14px}@media(max-width:560px){main{width:min(100% - 28px,760px);padding-top:32px}}
</style>
</head>
<body><main>
<header><div><h1 id="title">Weekly Notes</h1><p class="muted" id="subtitle">Choose a week</p></div><button id="theme-toggle" type="button">Dark</button></header>
<p class="back"><a href="page.html">← Back to notes</a></p>
<section><h2 id="heading">Available weeks</h2><p class="muted">Select a week to open the corresponding file.</p><div class="weeks" id="weeks"></div><p class="muted" id="empty" hidden>No materials are available for this category yet.</p></section>
<footer>© 2026 Jiayu Chen</footer>
</main>
<script>
const courses={
 "calculus":{name:"Calculus & Mathematical Analysis",weeks:{1:{pdf:"MAweek1.pdf",html:"MAweek1.html",exercises:"Homework1.pdf"}}},
 "linear-algebra":{name:"Linear Algebra",weeks:{1:{pdf:"LAweek1.pdf",html:"LAweek1.html",exercises:"LAexercises1.pdf"},2:{exercises:"LAexercises2.pdf"}}}
};
const params=new URLSearchParams(location.search),course=params.get("course")||"calculus",type=params.get("type")||"pdf",data=courses[course];
if(!data){location.replace("/en/notes/mathematical-notes/page.html");}
const typeName=type==="html"?"HTML":type==="exercises"?"Exercises":"PDF";
document.title=(data?data.name:"Weekly Notes")+" · "+typeName+" · Jiayu Chen";
document.getElementById("title").textContent=data?data.name:"Weekly Notes";
document.getElementById("subtitle").textContent=typeName+" · Weekly materials";
const base="/en/notes/mathematical-notes/"+(course==="calculus"?"calculus/":"linear-algebra/"),weeks=document.getElementById("weeks"),empty=document.getElementById("empty");
let count=0;
for(const [week,files] of Object.entries(data.weeks)){if(!files[type])continue;const link=document.createElement("a");link.className="week";link.href=base+files[type];link.textContent="Week "+week;if(type!=="html"){link.target="_blank";link.rel="noopener"}weeks.appendChild(link);count++}
if(!count){weeks.hidden=true;empty.hidden=false}
const root=document.documentElement,toggle=document.getElementById("theme-toggle"),saved=localStorage.getItem("theme"),prefers=window.matchMedia("(prefers-color-scheme: dark)").matches;function setTheme(d){root.classList.toggle("dark",d);toggle.textContent=d?"Light":"Dark"}setTheme(saved?saved==="dark":prefers);toggle.addEventListener("click",()=>{const d=!root.classList.contains("dark");setTheme(d);localStorage.setItem("theme",d?"dark":"light")});
</script>
</body>
</html>
