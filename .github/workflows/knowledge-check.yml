name: Knowledge content checks
on:
  pull_request:
    paths:
      - 'resources/**'
      - 'notes/reading-notes/**'
      - 'notes/mathematical-notes/page.html'
      - 'notes/mathematical-notes/weekly.html'
      - 'index.html'
      - 'resources/content/**'
      - 'resources/build.mjs'
      - 'resources/assets/knowledge.css'
      - 'resources/assets/catalogue.js'
      - 'resources/data/terminology-*.json'
      - 'resources/data/knowledge-paths.mjs'
      - 'resources/*knowledge*'
      - 'resources/knowledge-markdown.mjs'
      - 'resources/package*.json'
      - '.github/workflows/knowledge-check.yml'
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'notes/reading-notes/**'
      - 'notes/mathematical-notes/page.html'
      - 'notes/mathematical-notes/weekly.html'
      - 'index.html'
      - 'resources/content/**'
      - 'resources/build.mjs'
      - 'resources/assets/knowledge.css'
      - 'resources/assets/catalogue.js'
      - 'resources/data/terminology-*.json'
      - 'resources/data/knowledge-paths.mjs'
      - 'resources/*knowledge*'
      - 'resources/knowledge-markdown.mjs'
      - 'resources/package*.json'
      - '.github/workflows/knowledge-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --prefix resources --ignore-scripts --no-audit --no-fund
      - name: Verify original content and business rules with the legacy renderer
        run: |
          node resources/build.mjs --legacy
          node resources/test-knowledge.mjs --minimum
          node resources/check.mjs
          node resources/test-controls.mjs
          node resources/test-open-library.mjs
          node resources/test-admissions-audit.mjs
          node resources/test-country-coverage.mjs
          node resources/test-editorial-copy.mjs
      - run: node resources/build.mjs
      - run: node resources/test-portal.mjs
      - run: node resources/test-goal-paths.mjs
      - run: node resources/test-study-content.mjs
      - name: Generated knowledge pages are committed
        run: |
          git diff --exit-code -- resources notes index.html disclaimer.html
          test -z "$(git ls-files --others --exclude-standard -- resources notes index.html disclaimer.html | grep -v '^resources/node_modules/')"
      - name: Repeat build is deterministic, including permanent record IDs
        run: |
          node resources/build.mjs
          git diff --exit-code -- resources notes index.html disclaimer.html
